application:
  subdomain: 80h5
  multi_instance: false
  upstreams:
    - location: /
      backend: http://app-80h5:3080
  # 纯静态小游戏站：手机、平板打开就能玩，不必先过微服登录
  public_path:
    - /
services:
  app-80h5:
    # 镜像模式：Action 只读校验后把加速地址与摘要写在这里（ghcr.io → ghcr.1ms.run）
    # upstream: ghcr.io/liangminmx/80h5:latest
    # 可变 tag 必须指纹化：这行里的摘要就是 bump: patch 的基线
    image: ghcr.1ms.run/liangminmx/80h5:latest@sha256:17c8a014f9ba0b109d57d436d5b9f20dcb47e1a6eacaf01e8955696abda80df8
    user: root
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3080/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
usage: |
  80h5（网页版 NES 模拟器）：镜像里自带 644 个 FC 游戏——魂斗罗、超级玛丽、
  忍者龙剑传等等，打开就能玩。

  【操作】
  PC：方向键 + 键盘按键；手机/平板：页面上有触屏方向键与 A/B 键，横屏体验更好。

  【数据】
  纯静态站点，没有需要备份的数据；游戏 ROM 都在镜像里，升级只换镜像。
